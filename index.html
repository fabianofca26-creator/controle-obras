<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a2e">
<title>Controle de Obra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --line:#e3e5ea; --line2:#cfd3db;
  --tx:#161a20; --tx2:#5d646f; --tx3:#8b929d;
  --ac:#1f3a2e; --ac-tx:#fff;
  --ok-bg:#e7f4ea; --ok-tx:#1d5b30;
  --wa-bg:#fdf0d9; --wa-tx:#7a5106;
  --er-bg:#fbe9e9; --er-tx:#8f2020;
  --in-bg:#e8eff8; --in-tx:#17436f;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101317; --card:#181c22; --line:#272c34; --line2:#39404a;
    --tx:#eceef2; --tx2:#a3abb7; --tx3:#767e8a;
    --ac:#cfe3d6; --ac-tx:#0f1a14;
    --ok-bg:#16301f; --ok-tx:#8fd6a4;
    --wa-bg:#33270f; --wa-tx:#f0c476;
    --er-bg:#331818; --er-tx:#f0a0a0;
    --in-bg:#152538; --in-tx:#9dc4ee;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-weight:600;margin:0}
button{font:inherit;color:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:1fr}
aside{display:none}
.col{min-width:0;padding-bottom:78px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 14px 10px;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}
header h1{font-size:17px;line-height:1.2}
header p{margin:0;font-size:12px;color:var(--tx3)}
main{padding:0 14px}
.icobtn{background:none;border:0;padding:6px;border-radius:9px;color:var(--tx2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:13px}
.icobtn:active,.icobtn:hover{background:var(--line)}
.icobtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--tx2);margin:0 0 5px}
input,select,textarea{width:100%;font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
input[type=checkbox],input[type=radio]{width:auto;padding:0;margin:0;border:0;border-radius:0;flex:0 0 auto;accent-color:var(--ac)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.field{margin-bottom:12px}
.btn{width:100%;background:var(--ac);color:var(--ac-tx);border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer}
.btn:active,.btn:hover{opacity:.88}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--line2);font-weight:400;padding:10px}
.btn.sm{width:auto;padding:8px 14px;font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.rows{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row[aria-current=true]{background:var(--in-bg)}
.row .g{flex:1;min-width:0}
.row b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-size:13px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.mut{color:var(--tx3)}
.tag{display:inline-block;font-size:11.5px;padding:3px 8px;border-radius:10px;font-weight:500;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok-tx)}
.tag.wa{background:var(--wa-bg);color:var(--wa-tx)}
.tag.er{background:var(--er-bg);color:var(--er-tx)}
.tag.in{background:var(--in-bg);color:var(--in-tx)}
.tag.mut{background:var(--line);color:var(--tx2)}
.note{border-radius:10px;padding:11px 12px;font-size:13px;display:flex;gap:9px;align-items:flex-start;margin-bottom:10px}
.note.wa{background:var(--wa-bg);color:var(--wa-tx)}
.note.in{background:var(--in-bg);color:var(--in-tx)}
.chip{display:inline-block;font-size:12px;padding:6px 11px;border-radius:14px;border:1px solid var(--line2);color:var(--tx2);cursor:pointer;background:none;margin:0 6px 6px 0}
.chip[aria-pressed=true]{background:var(--in-bg);color:var(--in-tx);border-color:transparent}
.sec-t{font-size:12px;color:var(--tx2);margin:16px 0 7px;text-transform:uppercase;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi p{margin:0;font-size:11.5px;color:var(--tx2)}
.kpi b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ac)}
.hide{display:none!important}
.voltar{margin-bottom:8px}
.summary{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.schip{flex:0 0 auto;min-width:150px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--wa-tx);border-radius:10px;padding:9px 11px}
.schip.done{border-left-color:var(--ok-tx)}
.schip .n{font-weight:600;font-size:12px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.schip .b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.schip .c{display:flex;gap:10px;margin-top:3px;font-size:11px;color:var(--tx3)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.bottom button{flex:1;background:none;border:0;padding:9px 0 11px;font-size:11px;color:var(--tx3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bottom button svg,aside button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current=page]{color:var(--tx);font-weight:600}
dialog{border:0;border-radius:14px;padding:0;max-width:520px;width:calc(100% - 24px);background:var(--card);color:var(--tx);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dbody{padding:18px}
dialog h2{font-size:17px;margin-bottom:4px}
dialog .dacts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog .dacts .btn{width:auto;padding:10px 18px}
.mats{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.mats td{padding:6px 6px 6px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.mats td:last-child{text-align:right}
.filsub{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;background:var(--bg);padding:6px 8px;font-weight:600}
table.rep{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;display:block;overflow-x:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
table.rep td,table.rep th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.rep td:first-child,table.rep th:first-child{text-align:left;white-space:normal}
table.rep th{color:var(--tx2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.reali{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 8px;border-radius:10px;cursor:pointer;background:var(--line);color:var(--tx2)}
.reali.on{background:var(--ok-bg);color:var(--ok-tx)}
.gradewrap{overflow:auto;max-height:calc(100vh - 300px);border:1px solid var(--line);border-radius:var(--r)}
table.grade{border-collapse:separate;border-spacing:0;font-size:12px;background:var(--card);font-variant-numeric:tabular-nums}
table.grade th,table.grade td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;white-space:nowrap;text-align:right}
table.grade th{background:var(--bg);color:var(--tx2);font-weight:600;position:sticky;top:0;z-index:1;cursor:pointer}
table.grade td.h,table.grade th.h{position:sticky;left:0;background:var(--card);text-align:left;z-index:1}
table.grade th.h{z-index:3;background:var(--bg)}
table.grade tr.fil td{background:var(--bg);color:var(--tx2);text-transform:uppercase;font-size:10px;letter-spacing:.04em;position:sticky;left:0;text-align:left;font-weight:600}
table.grade td.cel{cursor:pointer}
table.grade td.cel.pago{background:var(--ok-bg);color:var(--ok-tx)}
table.grade td.cel:hover{outline:2px solid var(--ac);outline-offset:-2px}
@media (min-width:900px){
  .app{grid-template-columns:220px 1fr}
  aside{display:flex;flex-direction:column;gap:4px;padding:18px 12px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh}
  aside .brand{padding:4px 10px 16px}
  aside .brand h1{font-size:17px;line-height:1.2}
  aside .brand p{margin:2px 0 0;font-size:12px;color:var(--tx3)}
  aside button.tab{display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--tx2);cursor:pointer;text-align:left}
  aside button.tab:hover{background:var(--bg)}
  aside button.tab[aria-current=page]{background:var(--in-bg);color:var(--in-tx);font-weight:600}
  nav.bottom{display:none}
  .col{padding-bottom:30px}
  header{padding:20px 28px 12px}
  header h1{font-size:22px}
  main{padding:0 28px 28px}
  .kpi b{font-size:26px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><h1>Controle de Obra</h1><p>contratos & medições</p></div>
    <button class="tab" data-tab="painel"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg> Painel</button>
    <button class="tab" data-tab="contratos"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9 12h7M9 16h7"/></svg> Contratos</button>
    <button class="tab" data-tab="medicoes"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg> Medições</button>
    <button class="tab" data-tab="relatorios"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M6 20v-7M12 20V5M18 20v-10"/></svg> Relatórios</button>
    <button class="tab" data-tab="mais"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Mais</button>
  </aside>
  <div class="col">
    <header>
      <div class="t"><h1 id="hTit">Painel</h1><p id="hSub"></p></div>
      <button class="icobtn" id="btnTema" title="Recarregar" hidden></button>
    </header>
    <main id="main"></main>
  </div>
  <nav class="bottom">
    <button data-tab="painel"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Painel</button>
    <button data-tab="contratos"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9 12h7M9 16h7"/></svg>Contratos</button>
    <button data-tab="medicoes"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Medições</button>
    <button data-tab="relatorios"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M6 20v-7M12 20V5M18 20v-10"/></svg>Relatórios</button>
    <button data-tab="mais"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Mais</button>
  </nav>
</div>
<input type="file" id="fileImp" accept=".json,application/json" hidden>
<input type="file" id="fileDesc" accept=".csv,text/csv" hidden>
<dialog id="dlg"></dialog>

<script>
// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = v => (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fmtDate = iso => { if (!iso) return ""; const [y, m, d] = String(iso).split("-"); return `${d}/${m}/${y}`; };
const STATUS = { ativo: ["Ativo", "in"], desativado: ["Desativado", "mut"], concluido: ["Concluído", "ok"], encerrado: ["Encerrado", "mut"] };

// ---------- estado ----------
const TABELAS = ["modules", "houses", "house_groups", "service_catalog", "teams", "contracts",
  "contract_houses", "services", "service_house", "measurements", "entries", "reservations",
  "debts", "debt_payments", "house_docs"];
function PADRAO() { const s = { config: {} }; TABELAS.forEach(t => s[t] = []); return s; }
let S = PADRAO();
let IDX = {};
let tela = "painel";
let sel = null;          // contrato aberto
let subServico = null;   // serviço aberto dentro do contrato
let contratoView = "lista"; // "lista" | "grade"
let ocultarPagos = false;   // grade: esconde casas/serviços totalmente quitados
let servFiltroTeam = "";    // serviço: filtra casas pelo último empreiteiro
let busca = "", fStatus = "", fModulo = "", fAtencao = false;
let medTeam = "", medDe = "", medAte = "", medExp = null;
let repTipo = "resumo", repDim = "house", repMod = "", repCont = "", repServ = "", repTeam = "", repDe = "", repAte = "";
let descTeam = "", descStatus = "aberto", descExp = null, descImport = null;
let rastMod = "", rastSoNota = false;
let modSel = null, modChecks = new Set(), mapMod = "";

// índices e derivados (recalculados a cada salvar/importar)
function indexar() {
  IDX = {};
  const map = (arr) => { const m = new Map(); for (const x of arr) m.set(x.id, x); return m; };
  IDX.house = map(S.houses);
  IDX.contract = map(S.contracts);
  IDX.service = map(S.services);
  IDX.module = map(S.modules);
  IDX.team = map(S.teams);
  IDX.catalog = map(S.service_catalog);
  IDX.group = map(S.house_groups);
  IDX.sh = map(S.service_house);
  IDX.measurement = map(S.measurements);
  // total pago por service_house
  const paid = new Map();
  for (const e of S.entries) paid.set(e.service_house_id, (paid.get(e.service_house_id) || 0) + e.value_paid);
  IDX.paidBySH = paid;
  // casas por contrato
  const chByContract = new Map();
  for (const ch of S.contract_houses) { if (!chByContract.has(ch.contract_id)) chByContract.set(ch.contract_id, []); chByContract.get(ch.contract_id).push(ch.house_id); }
  IDX.housesByContract = chByContract;
  // service_house por contrato (via service)
  const shByContract = new Map();
  const shKey = new Map();
  for (const sh of S.service_house) {
    shKey.set(sh.service_id + "_" + sh.house_id, sh);
    const s = IDX.service.get(sh.service_id); if (!s) continue;
    if (!shByContract.has(s.contract_id)) shByContract.set(s.contract_id, []); shByContract.get(s.contract_id).push(sh);
  }
  IDX.shByContract = shByContract;
  IDX.shByKey = shKey;
  // rastreabilidade: casa -> conjunto de itens marcados
  const docs = new Map();
  for (const d of S.house_docs) { if (!docs.has(d.house_id)) docs.set(d.house_id, new Set()); docs.get(d.house_id).add(d.item); }
  IDX.docsByHouse = docs;
}
const ITENS_RAST = [
  { key: "radier", label: "Pedido Radier", grupo: "Pedidos" },
  { key: "parede", label: "Pedido Parede", grupo: "Pedidos" },
  { key: "oitao", label: "Pedido Oitão", grupo: "Pedidos" },
  { key: "ensaios_radier", label: "Ensaios Radier", grupo: "Ensaios" },
  { key: "ensaios_parede", label: "Ensaios Parede", grupo: "Ensaios" },
  { key: "ensaios_oitao", label: "Ensaios Oitão", grupo: "Ensaios" },
  { key: "mapeamento", label: "Mapeamento", grupo: "Ficha" },
  { key: "ficha", label: "Ficha montada", grupo: "Ficha" },
];
const docFeito = (hid, key) => !!(IDX.docsByHouse.get(hid) && IDX.docsByHouse.get(hid).has(key));
function marcarDoc(houseIds, keys, done) {
  for (const hid of houseIds) for (const k of keys) {
    const existe = docFeito(hid, k);
    if (done && !existe) S.house_docs.push({ id: nextId("house_docs"), house_id: hid, item: k, created_at: agoraSql() });
    else if (!done && existe) S.house_docs = S.house_docs.filter(d => !(d.house_id === hid && d.item === k));
  }
  salvar();
}
function casasDoModulo(mid) {
  const hs = S.houses.filter(h => h.module_id === mid);
  return hs.sort((a, b) => {
    const ua = a.group_id ? 0 : 1, ub = b.group_id ? 0 : 1; if (ua !== ub) return ua - ub;
    const ga = grupoOrdem(a.group_id), gb = grupoOrdem(b.group_id);
    if (ga[0] !== gb[0]) return ga[0] - gb[0]; if (ga[1] !== gb[1]) return ga[1] - gb[1];
    const na = natkey(a.name), nb = natkey(b.name); return na < nb ? -1 : na > nb ? 1 : 0;
  });
}
const natkey = s => String(s ?? "").replace(/\d+/g, n => n.padStart(12, "0"));
function nextId(tabela) { let m = 0; for (const x of S[tabela]) if (x.id > m) m = x.id; return m + 1; }
function agoraSql() { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function grupoOrdem(gid) { const g = IDX.group.get(gid); return g ? [g.order_index || 0, g.id] : [0, 0]; }
function casasDoContrato(cid) {
  const hs = (IDX.housesByContract.get(cid) || []).map(id => IDX.house.get(id)).filter(Boolean);
  return hs.sort((a, b) => {
    const ua = a.group_id ? 0 : 1, ub = b.group_id ? 0 : 1; if (ua !== ub) return ua - ub;
    const ga = grupoOrdem(a.group_id), gb = grupoOrdem(b.group_id);
    if (ga[0] !== gb[0]) return ga[0] - gb[0]; if (ga[1] !== gb[1]) return ga[1] - gb[1];
    const na = natkey(a.name), nb = natkey(b.name); return na < nb ? -1 : na > nb ? 1 : 0;
  });
}
const shDe = (serviceId, houseId) => IDX.shByKey.get(serviceId + "_" + houseId);
const entriesDe = shId => S.entries.filter(e => e.service_house_id === shId).sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
const nomeGrupo = h => (h.group_id ? (IDX.group.get(h.group_id) || {}).name : null) || "Sem fileira";

// mescla numa medição existente do empreiteiro+data, ou cria uma nova
function resolveMedicao(teamId, date, notes) {
  let m = S.measurements.find(x => x.team_id === teamId && x.date === date);
  if (!m) { m = { id: nextId("measurements"), team_id: teamId, date, notes: notes || null }; S.measurements.push(m); }
  return m.id;
}
// impede que o total pago passe do valor contratado (negativos/estorno passam)
function checarSaldo(sh, valor, excluirId) {
  const uv = unitValue(sh);
  let atual = 0; for (const e of S.entries) if (e.service_house_id === sh.id && e.id !== excluirId) atual += e.value_paid;
  if (atual + valor > uv + 0.01) throw new Error("Valor excede o saldo (disponível: " + money(uv - atual) + ")");
}
function recomputarStatus(cid) {
  const c = IDX.contract.get(cid); if (!c || c.status === "desativado" || c.status === "encerrado") return;
  const t = totaisDoContrato(cid);
  const novo = t.contratado > 0 && t.saldo <= 0.01 ? "concluido" : "ativo";
  if (novo !== c.status) c.status = novo;
}
// mutações: mexem no S, reindexam (pra o pago ficar fresco), recalculam status e persistem
function lancar(shId, mId, valor) {
  const sh = IDX.sh.get(shId); checarSaldo(sh, valor, null);
  const cid = IDX.service.get(sh.service_id).contract_id;
  S.entries.push({ id: nextId("entries"), service_house_id: shId, measurement_id: mId, value_paid: valor, created_at: agoraSql() });
  sh.completed = 1;
  indexar(); recomputarStatus(cid); persistir();
}
function lancarVarias(mId, itens) {
  for (const it of itens) checarSaldo(IDX.sh.get(it.shId), it.valor, null);
  const cid = IDX.service.get(IDX.sh.get(itens[0].shId).service_id).contract_id;
  for (const it of itens) {
    S.entries.push({ id: nextId("entries"), service_house_id: it.shId, measurement_id: mId, value_paid: it.valor, created_at: agoraSql() });
    IDX.sh.get(it.shId).completed = 1;
  }
  indexar(); recomputarStatus(cid); persistir();
}
function excluirLancamento(entryId) {
  const e = S.entries.find(x => x.id === entryId); if (!e) return;
  const cid = IDX.service.get(IDX.sh.get(e.service_house_id).service_id).contract_id;
  S.entries = S.entries.filter(x => x.id !== entryId);
  indexar(); recomputarStatus(cid); persistir();
}
function toggleRealizado(shId) { const sh = IDX.sh.get(shId); sh.completed = sh.completed ? 0 : 1; salvar(); }

// ---- relatórios ----
// uma linha por service_house, enriquecida, com filtros opcionais {contract_id, module_id}
function linhasBase(f = {}) {
  const out = [];
  for (const sh of S.service_house) {
    const s = IDX.service.get(sh.service_id); if (!s) continue;
    const c = IDX.contract.get(s.contract_id); if (!c) continue;
    if (f.contract_id && c.id !== f.contract_id) continue;
    if (f.module_id && c.module_id !== f.module_id) continue;
    const h = IDX.house.get(sh.house_id); if (!h) continue;
    const uv = unitValue(sh), pago = IDX.paidBySH.get(sh.id) || 0;
    out.push({ sh, service: s, contract: c, house: h, catalog: IDX.catalog.get(s.catalog_service_id) || {}, unit_value: uv, total_paid: pago, balance: uv - pago, completed: !!sh.completed });
  }
  return out;
}
// agrega as linhas por uma chave (casa/contrato/serviço)
function agrupar(linhas, chaveFn) {
  const g = new Map();
  for (const r of linhas) {
    const { key, label } = chaveFn(r);
    if (!g.has(key)) g.set(key, { label, unit_value: 0, total_paid: 0, balance: 0, count: 0, feitos: 0 });
    const x = g.get(key); x.unit_value += r.unit_value; x.total_paid += r.total_paid; x.balance += r.balance; x.count++; if (r.completed) x.feitos++;
  }
  return [...g.values()].map(x => ({ ...x, pctPago: x.unit_value > 0 ? x.total_paid / x.unit_value * 100 : 0, pctFeito: x.count > 0 ? x.feitos / x.count * 100 : 0 }));
}
function entradasDaMedicao(mId) {
  return S.entries.filter(e => e.measurement_id === mId).map(e => {
    const sh = IDX.sh.get(e.service_house_id) || {}, s = IDX.service.get(sh.service_id) || {}, c = IDX.contract.get(s.contract_id) || {}, h = IDX.house.get(sh.house_id) || {};
    return { id: e.id, valor: e.value_paid, contrato: (c.number || "") + " " + (c.name || ""), servico: (IDX.catalog.get(s.catalog_service_id) || {}).name || "", casa: h.name || "" };
  }).sort((a, b) => (a.contrato + a.casa).localeCompare(b.contrato + b.casa));
}
function evolucao(f = {}) {
  const porData = new Map();
  for (const e of S.entries) {
    const sh = IDX.sh.get(e.service_house_id); if (!sh) continue;
    const s = IDX.service.get(sh.service_id); if (!s) continue;
    const c = IDX.contract.get(s.contract_id); if (!c) continue;
    const m = IDX.measurement.get(e.measurement_id); if (!m) continue;
    if (f.contract_id && c.id !== f.contract_id) continue;
    if (f.module_id && c.module_id !== f.module_id) continue;
    if (f.team_id && m.team_id !== f.team_id) continue;
    if (f.date_from && m.date < f.date_from) continue;
    if (f.date_to && m.date > f.date_to) continue;
    if (!porData.has(m.date)) porData.set(m.date, { date: m.date, valor: 0, casas: new Set() });
    const g = porData.get(m.date); g.valor += e.value_paid; g.casas.add(sh.house_id);
  }
  const arr = [...porData.values()].map(g => ({ date: g.date, valor: g.valor, casas: g.casas.size })).sort((a, b) => a.date < b.date ? -1 : 1);
  let acc = 0; for (const g of arr) { acc += g.valor; g.acum = acc; }
  return arr;
}
function unitValue(sh) {
  const s = IDX.service.get(sh.service_id), h = IDX.house.get(sh.house_id);
  if (!s || !h) return 0;
  return h.type === "tipo_1" ? s.unit_value_type1 : s.unit_value_type2;
}
function cellsDoContrato(cid) {
  return (IDX.shByContract.get(cid) || []).map(sh => {
    const uv = unitValue(sh), pago = IDX.paidBySH.get(sh.id) || 0;
    return { sh, unit_value: uv, total_paid: pago, balance: uv - pago, completed: !!sh.completed, service_id: sh.service_id, house_id: sh.house_id };
  });
}
function totaisDoContrato(cid) {
  const cells = cellsDoContrato(cid);
  const contratado = cells.reduce((a, c) => a + c.unit_value, 0);
  const pago = cells.reduce((a, c) => a + c.total_paid, 0);
  return { contratado, pago, saldo: contratado - pago, cells };
}
// medições vinculadas a um contrato, numeradas por ordem de vínculo (1º lançamento)
function medicoesDoContrato(cid) {
  const shIds = new Set((IDX.shByContract.get(cid) || []).map(x => x.id));
  const firstLink = new Map();
  for (const e of S.entries) {
    if (!shIds.has(e.service_house_id)) continue;
    const key = e.created_at + "#" + String(e.id).padStart(12, "0");
    if (!firstLink.has(e.measurement_id) || key < firstLink.get(e.measurement_id)) firstLink.set(e.measurement_id, key);
  }
  return [...firstLink.entries()].sort((a, b) => a[1] < b[1] ? -1 : 1).map(([mid], i) => {
    const m = S.measurements.find(x => x.id === mid) || {};
    const t = IDX.team.get(m.team_id) || {};
    return { id: mid, seq: i + 1, team_name: t.name, date: m.date };
  });
}

// ---------- persistência (IndexedDB) ----------
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("obra", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite").objectStore("kv").put(v, k); t.onsuccess = () => res(); t.onerror = () => rej(t.error); }); }
let salvando = null;
function persistir() { S.config.salvoEm = new Date().toISOString(); salvando = idbSet("estado", S).catch(e => console.error("salvar", e)); if (typeof agendarSync === "function") agendarSync(); return salvando; }
function salvar() { indexar(); return persistir(); }

function baixar(nome, texto, tipo) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([texto], { type: tipo || "application/octet-stream" }));
  a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function carregarDados(d) {
  const novo = PADRAO();
  for (const t of TABELAS) if (Array.isArray(d[t])) novo[t] = d[t];
  novo.config = Object.assign({}, S.config, d.config || {});
  S = novo; salvar();
}

// ---------- navegação / render ----------
function ir(t) { tela = t; sel = null; render(); }
const GRUPO_MAIS = ["mais", "modulos", "catalogo", "descontos", "rastreabilidade", "mapa"];
function render() {
  const grupo = GRUPO_MAIS.includes(tela) ? "mais" : tela;
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-current", b.dataset.tab === grupo && !sel ? "page" : "false"));
  const V = { painel: vPainel, contratos: vContratos, medicoes: vMedicoes, relatorios: vRelatorios, mais: vMais, modulos: vModulos, catalogo: vCatalogo, descontos: vDescontos, rastreabilidade: vRastreabilidade, mapa: vMapa };
  if (tela === "contratos" && sel) return subServico ? vServico() : vContrato();
  (V[tela] || vPainel)();
}
function topo(titulo, sub) { document.getElementById("hTit").textContent = titulo; document.getElementById("hSub").textContent = sub || ""; }

// ---------- Painel ----------
function vPainel() {
  const ativos = S.contracts.filter(c => c.status === "ativo").length;
  let contratado = 0, pago = 0;
  const porModulo = new Map();
  for (const c of S.contracts) {
    const t = totaisDoContrato(c.id);
    contratado += t.contratado; pago += t.pago;
    if (!porModulo.has(c.module_id)) porModulo.set(c.module_id, { nome: (IDX.module.get(c.module_id) || {}).name || "—", contratos: [], contratado: 0, pago: 0 });
    const g = porModulo.get(c.module_id);
    g.contratos.push({ c, t }); g.contratado += t.contratado; g.pago += t.pago;
  }
  topo("Painel", S.contracts.length + " contratos · " + S.houses.length + " casas");
  const kpis = `<div class="kpis">
    <div class="kpi"><p>Contratos ativos</p><b>${ativos}</b></div>
    <div class="kpi"><p>Contratado</p><b>${money(contratado)}</b></div>
    <div class="kpi"><p>Pago</p><b>${money(pago)}</b></div>
    <div class="kpi"><p>Saldo</p><b>${money(contratado - pago)}</b></div>
  </div>`;
  const modulos = [...porModulo.values()].map(g => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <h2 style="font-size:16px">${esc(g.nome)}</h2>
        <span class="mut" style="font-size:12px">Saldo ${money(g.contratado - g.pago)}</span>
      </div>
      <div class="rows" style="margin-top:10px">
        ${g.contratos.sort((a, b) => a.c.number.localeCompare(b.c.number)).map(({ c, t }) => `
          <button class="row" data-act="abrir" data-id="${c.id}">
            <div class="g"><b>${esc(c.number)} — ${esc(c.name)}</b><small>Pago ${money(t.pago)} · ${STATUS[c.status] ? STATUS[c.status][0] : c.status}</small></div>
            <span class="v">${money(t.saldo)}</span>
          </button>`).join("")}
      </div>
    </div>`).join("");
  document.getElementById("main").innerHTML = kpis + (modulos || `<p class="mut">Nenhum contrato ainda. Importe seus dados em Mais → Importar backup.</p>`);
}

function vContratos() {
  const q = busca.trim().toLowerCase();

// ---------- Contrato (resumo — só leitura nesta fase) ----------
function vContrato() {
  const c = IDX.contract.get(sel);
  if (!c) { sel = null; return vContratos(); }
  const t = totaisDoContrato(c.id);
  const meds = medicoesDoContrato(c.id);
  const ultima = meds[meds.length - 1];
  const st = STATUS[c.status] || [c.status, "mut"];
  // resumo por serviço
  const porServico = new Map();
  for (const cell of t.cells) {
    const s = IDX.service.get(cell.service_id); if (!s) continue;
    const nome = (IDX.catalog.get(s.catalog_service_id) || {}).name || "—";
    if (!porServico.has(s.id)) porServico.set(s.id, { nome, saldo: 0, aPagar: 0, aReali: 0, total: 0 });
    const g = porServico.get(s.id);
    g.saldo += cell.balance; g.total++; if (cell.balance > 0.01) g.aPagar++; if (!cell.completed) g.aReali++;
  }
  topo(c.number + " — " + c.name, (IDX.module.get(c.module_id) || {}).name || "");
  const servicos = [...porServico.entries()].map(([sid, s]) => `
    <button class="row" data-act="verServico" data-id="${sid}">
      <div class="g"><b>${s.aPagar === 0 && s.aReali === 0 ? "✓ " : ""}${esc(s.nome)}</b><small>A pagar ${s.aPagar}/${s.total} · A realizar ${s.aReali}/${s.total}</small></div>
      <span class="v">${money(s.saldo)}</span>

  document.getElementById("main").innerHTML = `
    <button class="btn sec sm voltar" data-act="voltar">← Contratos</button>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="tag ${st[1]}">${st[0]}</span>
        <span class="mut" style="font-size:12px">${(IDX.housesByContract.get(c.id) || []).length} casas</span>
      </div>
      <p class="mut" style="font-size:13px;margin:10px 0 0">Última medição lançada: ${ultima ? `<b style="color:var(--in-tx)">Nº${ultima.seq} · ${esc(ultima.team_name)} — ${fmtDate(ultima.date)}</b>` : "nenhuma ainda"}</p>
    </div>
    <div class="kpis">
      <div class="kpi"><p>Contratado</p><b>${money(t.contratado)}</b></div>
      <div class="kpi"><p>Pago</p><b>${money(t.pago)}</b></div>
      <div class="kpi"><p>Saldo</p><b>${money(t.saldo)}</b></div>
    </div>
    <div style="margin:4px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">

      <button class="chip" data-act="viewGrade" aria-pressed="${contratoView === "grade"}">Grade</button>
      ${contratoView === "grade" ? `<button class="chip" data-act="togOcultar" aria-pressed="${ocultarPagos}">Ocultar pagos</button>` : ""}
      <button class="btn sm" data-act="novoServico" style="margin-left:auto;width:auto">+ Novo serviço</button>
    </div>
    ${contratoView === "grade" ? gradeHTML(c.id) : `<p class="sec-t" style="margin-top:4px">Serviços — toque para lançar</p><div class="rows">${servicos || '<div class="row"><span class="mut">Nenhum serviço.</span></div>'}</div>`}`;
}

// grade: matriz casas (linhas) × serviços (colunas); célula = saldo, clique lança
function gradeHTML(cid) {
  const fullServices = S.services.filter(s => s.contract_id === cid).sort((a, b) => (a.order_index || 0) - (b.order_index || 0));
  if (!fullServices.length) return '<p class="mut">Sem serviços neste contrato.</p>';
  const nome = s => (IDX.catalog.get(s.catalog_service_id) || {}).name || "—";
  const allHouses = casasDoContrato(cid);
  const emAberto = sh => sh && (unitValue(sh) - (IDX.paidBySH.get(sh.id) || 0)) > 0.01;
  let services = fullServices, houses = allHouses;
  if (ocultarPagos) {
    services = fullServices.filter(s => allHouses.some(h => emAberto(shDe(s.id, h.id))));
    houses = allHouses.filter(h => fullServices.some(s => emAberto(shDe(s.id, h.id))));
  }
  if (!services.length || !houses.length) return '<p class="mut">Tudo pago neste contrato. 🎉</p>';
  let head = `<tr><th class="h">Casa</th>${services.map(s => `<th data-act="bulk" data-id="${s.id}" title="Lançar em várias casas — ${esc(nome(s))}">${esc(nome(s))}</th>`).join("")}</tr>`;
  let body = "", grupo = null;
  for (const h of houses) {
    const g = nomeGrupo(h);
    if (g !== grupo) { grupo = g; body += `<tr class="fil"><td colspan="${services.length + 1}">${esc(g)}</td></tr>`; }
    let tds = "";
    for (const s of services) {
      const sh = shDe(s.id, h.id);
      if (!sh) { tds += `<td class="mut" style="text-align:center">—</td>`; continue; }
      const saldo = unitValue(sh) - (IDX.paidBySH.get(sh.id) || 0);
      tds += `<td class="cel ${saldo <= 0.01 ? "pago" : ""}" data-act="lancarCel" data-sh="${sh.id}" title="${esc(nome(s))} — ${esc(h.name)}">${sh.completed ? "✓ " : ""}${money(saldo)}</td>`;
    }
    body += `<tr><td class="h" data-act="bulkCasa" data-id="${h.id}" style="cursor:pointer" title="Lançar todos os serviços desta casa">${esc(h.name)} <span class="mut">${h.type === "tipo_1" ? "T1" : "T2"}</span></td>${tds}</tr>`;
  }
  return `<div class="gradewrap"><table class="grade"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

  document.getElementById("main").innerHTML = `
    <button class="btn sec sm voltar" data-act="voltarServico">← ${esc(c.number)}</button>
    <div class="card">

function chartEvolucao(dados) {
  const W = 320, H = 88, pad = 4, max = Math.max(...dados.map(d => d.acum), 1), n = dados.length;
  const x = i => n <= 1 ? W / 2 : pad + i * (W - 2 * pad) / (n - 1), y = v => H - pad - v / max * (H - 2 * pad);
  const pts = dados.map((d, i) => `${x(i).toFixed(1)},${y(d.acum).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100px;margin:6px 0;display:block">
    <polygon points="${pad},${H - pad} ${pts} ${x(n - 1).toFixed(1)},${H - pad}" fill="var(--in-bg)"/>
    <polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2"/></svg>`;
}
function relEvolucao() {
  const dados = evolucao({ module_id: repMod ? Number(repMod) : null, team_id: repTeam ? Number(repTeam) : null, date_from: repDe || null, date_to: repAte || null });

  if (!dados.length) return filtros + '<p class="mut" style="margin-top:12px">Sem lançamentos para o filtro.</p>';
  const media = (dados.reduce((a, d) => a + d.casas, 0) / dados.length).toFixed(1);
  const body = dados.map(d => `<tr><td>${fmtDate(d.date)}</td><td>${d.casas}</td><td>${money(d.valor)}</td><td>${money(d.acum)}</td></tr>`).join("");
  return filtros + chartEvolucao(dados) + `<p class="mut" style="font-size:13px">Média: <b>${media}</b> casas/medição</p><table class="rep"><tr><th>Data</th><th>Casas</th><th>Pago</th><th>Acumulado</th></tr>${body}</table>`;
}

// importação de CSV: EMPREITEIRO;DESCRIÇÃO;VALOR (aceita ; ou , como separador; casa nomes com o catálogo)
function processarCsvDescontos(texto) {
  const linhas = texto.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (linhas.length < 2) return { erro: "Planilha vazia." };
  const sep = (linhas[0].match(/;/g) || []).length >= (linhas[0].match(/,/g) || []).length ? ";" : ",";
  const H = linhas[0].split(sep).map(s => s.trim().toUpperCase());
  const iE = H.findIndex(h => h.includes("EMPREIT")), iD = H.findIndex(h => h.includes("DESCRI")), iV = H.findIndex(h => h.includes("VALOR"));
  if (iE < 0 || iD < 0 || iV < 0) return { erro: "Preciso das colunas EMPREITEIRO, DESCRIÇÃO e VALOR." };
  const idByName = new Map(S.teams.map(t => [t.name.trim().toUpperCase(), t.id]));
  const rows = [], naoAchou = new Map();
  for (const l of linhas.slice(1)) {
    const c = l.split(sep); const nome = (c[iE] || "").trim(); if (!nome) continue;
    const tid = idByName.get(nome.toUpperCase());
    if (!tid) { naoAchou.set(nome, (naoAchou.get(nome) || 0) + 1); continue; }
    let v = (c[iV] || "").replace(/[R$\s]/g, ""); if (v.includes(",")) v = v.replace(/\./g, "").replace(",", ".");
    rows.push({ team_id: tid, team_name: nome, description: (c[iD] || "").trim(), total_amount: Number(v) || 0 });

// ---------- Google Drive ----------
// ponytail: última versão ganha, sem mesclagem por registro. Usuário único
// (um aparelho por vez); sincroniza ao abrir a sessão e 3 s após cada alteração.
// Se editar em dois aparelhos sem sincronizar no meio, a versão mais antiga perde.
const DRIVE = { estado: "off", erro: "", quando: null, timer: null };
const SCOPE_DRIVE = "https://www.googleapis.com/auth/drive.file";
function tokenValido() {
  try { const t = JSON.parse(sessionStorage.getItem("obra_tok") || "null"); return t && t.exp > Date.now() + 60000 ? t.tok : null; } catch (e) { return null; }
}
function conectar() {
  return new Promise((res, rej) => {
    if (!S.config.driveClientId) return rej(new Error("informe o Client ID nos ajustes"));
    if (!window.google || !google.accounts) return rej(new Error("biblioteca do Google não carregou (sem internet?)"));
    google.accounts.oauth2.initTokenClient({
      client_id: S.config.driveClientId, scope: SCOPE_DRIVE,
      callback: r => {
        if (r.error) return rej(new Error(r.error));
        sessionStorage.setItem("obra_tok", JSON.stringify({ tok: r.access_token, exp: Date.now() + r.expires_in * 1000 }));
        res(r.access_token);
      },
      error_callback: e => rej(new Error(e.type === "popup_closed" ? "janela fechada" : e.type || "erro"))
    }).requestAccessToken({ prompt: "" });
  });
}
async function dapi(path, opts = {}, upload = false) {
  const tok = tokenValido(); if (!tok) throw new Error("não conectado");
  const r = await fetch((upload ? "https://www.googleapis.com/upload/drive/v3/" : "https://www.googleapis.com/drive/v3/") + path,
    Object.assign({}, opts, { headers: Object.assign({ Authorization: "Bearer " + tok }, opts.headers || {}) }));
  if (r.status === 401) { sessionStorage.removeItem("obra_tok"); throw new Error("sessão expirou, conecte de novo"); }
  if (!r.ok) { let msg = ""; try { msg = (await r.json()).error.message; } catch (e) { } throw new Error("Drive respondeu " + r.status + (msg ? ": " + msg : "")); }
  return r;
}
const dBuscar = async (nome, pasta) => {
  const q = `name='${nome}' and trashed=false` + (pasta ? ` and '${pasta}' in parents` : "");
  return (await (await dapi("files?q=" + encodeURIComponent(q) + "&fields=files(id,modifiedTime)")).json()).files[0] || null;
};
async function dCriar(nome, blob, pasta, mime) {
  const meta = { name: nome, parents: pasta ? [pasta] : [] };
  if (!blob) meta.mimeType = "application/vnd.google-apps.folder";
  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
  if (blob) fd.append("file", new Blob([blob], { type: mime }));
  const r = await dapi(blob ? "files?uploadType=multipart&fields=id" : "files?fields=id", { method: "POST", body: blob ? fd : JSON.stringify(meta), headers: blob ? {} : { "Content-Type": "application/json" } }, !!blob);
  return (await r.json()).id;
}
const dAtualizar = (id, blob, mime) => dapi("files/" + id + "?uploadType=media", { method: "PATCH", body: blob, headers: { "Content-Type": mime } }, true);
async function pastaDrive() {
  const p = await dBuscar("Controle de Obra");
  return p ? p.id : dCriar("Controle de Obra", null);
}
async function sincronizar(interativo) {
  if (DRIVE.estado === "busy") return;
  let mudou = false;
  try {
    if (!tokenValido()) { if (!interativo) return; await conectar(); }
    DRIVE.estado = "busy"; if (tela === "mais") vMais();
    const pasta = await pastaDrive();
    const arq = await dBuscar("controle-obra.json", pasta);
    let subir = !arq;
    if (arq) {
      const remoto = JSON.parse(await (await dapi("files/" + arq.id + "?alt=media")).text());
      const rs = (remoto.config && remoto.config.salvoEm) || "", ls = S.config.salvoEm || "";
      if (rs > ls) {
        const novo = PADRAO();
        for (const t of TABELAS) if (Array.isArray(remoto[t])) novo[t] = remoto[t];
        novo.config = Object.assign({}, remoto.config || {});
        novo.config.driveClientId = novo.config.driveClientId || S.config.driveClientId;
        S = novo; indexar(); await idbSet("estado", S); mudou = true;
      } else if (ls > rs) subir = true;
    }
    if (subir) {
      const blob = new Blob([JSON.stringify(S)], { type: "application/json" });
      if (arq) await dAtualizar(arq.id, blob, "application/json"); else await dCriar("controle-obra.json", blob, pasta, "application/json");
    }
    DRIVE.estado = "sync"; DRIVE.quando = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    DRIVE.estado = tokenValido() ? "err" : "off"; DRIVE.erro = e.message;
    if (interativo) alert("Não sincronizou: " + e.message);
  }
  if (mudou) render(); else if (tela === "mais") vMais();
}
function agendarSync() {
  if (!tokenValido()) return;
  clearTimeout(DRIVE.timer);
  DRIVE.timer = setTimeout(() => sincronizar(false), 3000);
}

// ---------- init ----------
async function init() {
  try {
    const salvo = await idbGet("estado");
    if (salvo && salvo.contracts) { S = salvo; indexar(); }
    else {
      // primeira vez: tenta semear com o arquivo de migração (só existe localmente; nunca vai pro repo público)
      try {
        const r = await fetch("./dados-migrados.json", { cache: "no-store" });
        if (r.ok) { carregarDados(await r.json()); }
        else indexar();
      } catch { indexar(); }
    }
  } catch (e) { console.error(e); indexar(); }
  render();
  if (tokenValido()) sincronizar(false);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
}
